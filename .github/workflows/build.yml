name: Build app
# Any change under fonte/ (from Claude or edited on github.com) rebuilds index.html and publishes it.
on:
  push:
    branches: [main]
    paths: ['fonte/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 fonte/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || (git commit -m "Build automático da app" && git push)
